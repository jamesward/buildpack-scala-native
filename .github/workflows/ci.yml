name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x --severity=warning bin/detect bin/compile bin/release bin/test bin/test-compile bin/util/*.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stub-based tests: no Scala Native toolchain needed.
      - run: ./test/smoke-stub.sh
      - run: ./test/smoke-sbt2-stub.sh
      - run: ./test/smoke-subproject.sh
      - run: ./test/apt-install-unit.sh
